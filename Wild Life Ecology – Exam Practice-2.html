<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WildlifeExam">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d6a4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a16" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Wild Life Ecology – Exam Practice</title>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#15251f;--mute:#5b6b64;--line:#d3ddd7;--pri:#2d6a4f;--pri-ink:#fff;--ok:#1f7a4d;--okbg:#e1f3e8;--bad:#b3372f;--badbg:#fbe6e3;--warn:#9a5a08;--warnbg:#fdf0d9;--bg-rgb:238,243,239;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#17251f;--ink:#e6efea;--mute:#9db0a6;--line:#2a3d35;--pri:#6cc69a;--pri-ink:#0b1712;--ok:#6cd49a;--okbg:#173a2a;--bad:#ff8f85;--badbg:#3f1d1a;--warn:#e7b056;--warnbg:#3a2c12;--bg-rgb:15,26,22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#17251f;--ink:#e6efea;--mute:#9db0a6;--line:#2a3d35;--pri:#6cc69a;--pri-ink:#0b1712;--ok:#6cd49a;--okbg:#173a2a;--bad:#ff8f85;--badbg:#3f1d1a;--warn:#e7b056;--warnbg:#3a2c12;--bg-rgb:15,26,22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color .3s ease,color .3s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;transition:background-color .3s ease}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.stem{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
h1{font-size:1.9rem;line-height:1.15;margin:.2em 0 .1em}
h2{font-size:1.25rem;margin:1.6em 0 .6em}
.sub,.mute{color:var(--mute);margin:0;transition:color .3s ease}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:600;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center}
.btn:hover:not(:disabled){transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(0,0,0,.12);filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translateY(0);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:rgba(128,128,128,.08);border-color:var(--pri)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.pb:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;width:100%;transition:transform .22s cubic-bezier(.4,0,.2,1),box-shadow .22s cubic-bezier(.4,0,.2,1),border-color .2s ease,background-color .3s ease}
button.card{cursor:pointer}
button.card:hover{border-color:var(--pri);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
button.card:active{transform:translateY(-1px)}
.card b{display:block}
.big{border-color:var(--pri);border-width:2px}
.tag{display:inline-block;font-size:.8rem;border-radius:99px;padding:2px 10px;margin:6px 6px 0 0;background:var(--okbg);color:var(--ok);font-weight:500;transition:all .2s ease}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.b{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.qtop{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(var(--bg-rgb),.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:11;padding:12px 0 6px;transition:background-color .3s ease}
.stem{font-size:1.25rem;line-height:1.45;margin:.4em 0 1em}
.opt{display:flex;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 10px;cursor:pointer;transition:transform .18s cubic-bezier(.4,0,.2,1),border-color .18s ease,background-color .18s ease,box-shadow .18s ease}
.opt:hover:not(.ok):not(.bad){border-color:var(--pri);transform:translateY(-1.5px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.opt:active:not(.ok):not(.bad){transform:translateY(0)}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:600;transition:all .2s ease}
.opt.sel{border-color:var(--pri);border-width:2px}.opt.sel i{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok);transform:none}.opt.bad{background:var(--badbg);border-color:var(--bad);transform:none}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin:12px 0;animation:fadeIn .2s ease-out}
.pb{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1)}
.pb:hover{transform:scale(1.08);border-color:var(--pri)}
.pb.a{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.pb.c{outline:2.5px solid var(--ink)}
.score{font:700 3.2rem/1 Georgia,serif;margin:.2em 0}
.rv{border-top:1px solid var(--line);padding:14px 0;transition:background-color .2s ease}.rv p{margin:.25em 0}
.good{color:var(--ok)}.wrong{color:var(--bad)}
.wk{display:grid;grid-template-columns:70px 1fr 56px;gap:10px;align-items:center;font-size:.92rem;padding:3px 0}
details{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 12px;transition:all .25s ease}
details[open]{box-shadow:0 4px 16px rgba(0,0,0,.04)}
summary{cursor:pointer;font-weight:600;user-select:none;outline:none}
td,th{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:left;font-size:.92rem}
.scroll{overflow-x:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.stem,.opt,.grid,.card{animation:fadeIn .25s cubic-bezier(.16,1,.3,1) both}
@media (max-width:520px){h1{font-size:1.6rem}.stem{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}

.tip-box{background:var(--okbg);border:1.5px solid var(--ok);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem;line-height:1.45;animation:fadeIn .2s ease-out}
:root[data-theme="dark"] .tip-box,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip-box{background:#153326;border-color:#3e8f66;color:#e6efea}}
.trick-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:12px}
.trick-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.9rem;line-height:1.5;transition:transform .2s ease,box-shadow .2s ease}
.trick-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06);border-color:var(--pri)}
.trick-card b.head{color:var(--pri);display:block;margin-bottom:6px;font-size:.95rem}
.trick-card code{background:rgba(128,128,128,.12);padding:1px 5px;border-radius:4px;font-family:monospace;font-weight:600}
</style>
</head>

<script>
const QS=[{"id":"1-1","w":1,"n":1,"q":"Ecology is the scientific study of _____ that determine the distribution and abundance of organisms. (Fill in the blanks)","o":["statics","interactions","dynamics","habitat"],"a":1},{"id":"1-2","w":1,"n":2,"q":"Carolus Linnaeus is considered the father of:","o":["Biogeography","Modern taxonomy","Population ecology","Botanical geography"],"a":1},{"id":"1-3","w":1,"n":3,"q":"“Enquiry into plants” is a book written by","o":["Theophrastus","Linnaeus","Malthus","Humboldt"],"a":0},{"id":"1-4","w":1,"n":4,"q":"Who amongst these is considered the father of Biogeography?","o":["Theophrastus","Linnaeus","Malthus","Humboldt"],"a":3},{"id":"1-5","w":1,"n":5,"q":"Genetic adaptation refers to:","o":["High reproductive rate in one generation","Inheritable fitness","Physical strength of an individual","Short-term environmental comfort"],"a":1},{"id":"1-6","w":1,"n":6,"q":"Thomas Robert Malthus influenced studies in:","o":["Community ecology","Marine ecology","Population ecology","Behavioural ecology"],"a":2},{"id":"1-7","w":1,"n":7,"q":"Which approach tests ecological ideas through experiments?","o":["Theoretical approach","Field approach","Laboratory approach","Descriptive approach"],"a":2},{"id":"1-8","w":1,"n":8,"q":"Which approach mainly depends on direct observation of organisms in natural surroundings?","o":["Laboratory approach","Historical approach","Theoretical approach","Field approach"],"a":3},{"id":"1-9","w":1,"n":9,"q":"In the Greek word root of Ecology, logos refers to","o":["household","preservation","environment","study"],"a":3},{"id":"1-10","w":1,"n":10,"q":"Charles Darwin is associated with:","o":["The theory of ecosystem formation","The theory of taxonomy","The theory of botanical geography","The theory of evolution and natural selection"],"a":3},{"id":"2-1","w":2,"n":1,"q":"Hierarchy emerges almost inevitably through a wide variety of evolutionary processes, for the simple reason that hierarchical structures are (Fill in the blank)","o":["perfect","imperfect","stable","unstable"],"a":2},{"id":"2-2","w":2,"n":2,"q":"Which level is formed when similar cells and their extracellular matrix from the same origin together perform a specific function?","o":["Organ","Tissue","Organ system","Population"],"a":1},{"id":"2-3","w":2,"n":3,"q":"“The diversity that exists within an ecosystem” is","o":["alpha (α) biodiversity","beta (β) biodiversity","gamma (γ) biodiversity","delta (δ) biodiversity"],"a":0},{"id":"2-4","w":2,"n":4,"q":"“Groups of actually or potentially interbreeding natural populations, which are reproductively isolated from other such groups” is a definition of","o":["cells","species","ecosystems","biomes"],"a":1},{"id":"2-5","w":2,"n":5,"q":"The emergent principle can be stated as","o":["Whole = sum of parts","Whole < sum of parts","Whole > sum of parts","None of these"],"a":2},{"id":"2-6","w":2,"n":6,"q":"The smallest unit of life is the:","o":["Cell","Tissue","Organ","Organism"],"a":0},{"id":"2-7","w":2,"n":7,"q":"The diversity of genetic information present at the levels of phyla, families, species, populations and individuals is called:","o":["Ecosystem biodiversity","Species evenness","Genetic biodiversity","Species richness"],"a":2},{"id":"2-8","w":2,"n":8,"q":"The value of leaving use and non-use values for future generations is called:","o":["Altruistic value","Option value","Existence value","Bequest value"],"a":3},{"id":"2-9","w":2,"n":9,"q":"Value arising even though a resource is not being used is called:","o":["Direct value","Indirect value","Non-use value","Productive value"],"a":2},{"id":"2-10","w":2,"n":10,"q":"Species richness refers to:","o":["The distribution of individuals among different species","The genetic variation within one population","The number of ecosystems in a biome","The number of species present"],"a":3},{"id":"3-1","w":3,"n":1,"q":"I observe a bird take a tick out of another bird’s head and eat it. In the social context, this behaviour would be called","o":["tick hunting","auto grooming","allo grooming","foraging"],"a":2},{"id":"3-2","w":3,"n":2,"q":"Leech is an example of","o":["endoparasite","herbivore predator","parasitoid","ectoparasite"],"a":3},{"id":"3-3","w":3,"n":3,"q":"An ecological interaction in which both participating organisms are harmed is called","o":["mutualism","commensalism","competition","neutralism"],"a":2},{"id":"3-4","w":3,"n":4,"q":"Interspecific interaction occurs between","o":["members of different species","members of the same species","two organisms that are both benefited","two organisms that remain unaffected"],"a":0},{"id":"3-5","w":3,"n":5,"q":"The distance maintained by nesting penguins to avoid pecking from neighbours is related to","o":["herbivory","parasitoid pressure","prey switching","territorial spacing"],"a":3},{"id":"3-6","w":3,"n":6,"q":"A parasite that lives inside the body of its host is called","o":["ectoparasite","endoparasite","predator","commensal"],"a":1},{"id":"3-7","w":3,"n":7,"q":"Birds on giraffe are an example of","o":["colony","commensalism","protocooperation","allelopathy"],"a":2},{"id":"3-8","w":3,"n":8,"q":"Competition in which organisms directly consume a limited resource so that less remains for others is called","o":["interference competition","exploitative competition","apparent competition","neutral competition"],"a":1},{"id":"3-9","w":3,"n":9,"q":"Interference competition is also known as","o":["apparent competition","contest competition","niche competition","exploitative competition"],"a":1},{"id":"3-10","w":3,"n":10,"q":"The scientific study of animal behaviour is called","o":["behaviourism","ecology","ethology","prey-predator dynamics"],"a":2},{"id":"4-1","w":4,"n":1,"q":"Consider the food chain: Grass → Grasshopper → Frog → Snake → Hawk. In this food chain","o":["hawk is producer","hawk is consumer and carnivore","hawk is consumer and herbivore","hawk is decomposer"],"a":1},{"id":"4-2","w":4,"n":2,"q":"Trees → Birds → Parasites → Hyperparasites represents","o":["upright pyramid of numbers","inverted pyramid of numbers","spindle pyramid of numbers","dumb-bell pyramid of numbers"],"a":1},{"id":"4-3","w":4,"n":3,"q":"Glacial lakes are typical examples of","o":["eutrophic lakes","hypereutrophic lakes","oligotrophic lakes","mesotrophic lakes"],"a":2},{"id":"4-4","w":4,"n":4,"q":"In a grazing food chain, the first trophic level after producers is generally occupied by:","o":["Carnivores","Decomposers","Detritivores","Herbivores"],"a":3},{"id":"4-5","w":4,"n":5,"q":"Which statement correctly defines net primary production?","o":["Energy intercepted by producers from the Sun","Total energy lost during transfer between trophic levels","Gross primary production minus energy lost through respiration per unit time","Energy stored only in herbivore biomass"],"a":2},{"id":"4-6","w":4,"n":6,"q":"Which statement correctly defines gross primary production?","o":["Energy fixed through photosynthesis per unit time","Energy lost by organisms through respiration per unit time","Total number of producers in an ecosystem","Organic matter consumed by herbivores per unit time"],"a":0},{"id":"4-7","w":4,"n":7,"q":"Which chain best represents a detritus food chain?","o":["Fallen leaves → detritivores → small fish → large fish","Grass → chital → tiger","Rat → flea → parasitic protozoa","Phytoplankton → zooplankton → fish → sea lion"],"a":0},{"id":"4-8","w":4,"n":8,"q":"Consider the food chain: Grass → Grasshopper → Frog → Snake → Hawk. As we move up the food chain","o":["available energy decreases","available energy increases","available energy remains same","available energy is zero everywhere"],"a":0},{"id":"4-9","w":4,"n":9,"q":"Which statement correctly describes a decomposer?","o":["It only feeds on living plants","It consumes only primary consumers","It converts dead material into soil and recycles nutrients","It always occupies the quaternary trophic level"],"a":2},{"id":"4-10","w":4,"n":10,"q":"Which description best defines a heterotroph?","o":["An organism that converts sunlight directly into inorganic nutrients","An organism that cannot produce its own food and depends on organic carbon from other sources","An organism that uses chemical reactions to manufacture minerals","An organism that occupies only the first trophic level"],"a":1},{"id":"5-1","w":5,"n":1,"q":"In population dynamics, which pair represents additions to an existing population?","o":["Mortality and emigration","Natality and immigration","Mortality and natality","Immigration and emigration"],"a":1},{"id":"5-2","w":5,"n":2,"q":"Cover board surveys are typically used for sampling","o":["herpetofauna","fishes","large mammals","carnivores"],"a":0},{"id":"5-3","w":5,"n":3,"q":"Pan traps are used for sampling","o":["bees","butterflies","non-pollinator insects","pollinator insects"],"a":3},{"id":"5-4","w":5,"n":4,"q":"A sampling procedure such that each possible combination of sampling units out of the population has the same chance of being selected is referred to as","o":["Simple random sampling","Systematic sampling","Stratified sampling","Multistage sampling"],"a":0},{"id":"5-5","w":5,"n":5,"q":"The minimum replacement level fertility for a population to grow should be greater than","o":["1","2","3","4"],"a":1},{"id":"5-6","w":5,"n":6,"q":"A list of sampling units is called a:","o":["Sample","Sampling intensity","Sampling frame","Stratum"],"a":2},{"id":"5-7","w":5,"n":7,"q":"In capture-recapture method, the first stage involves:","o":["Counting faecal pellets","Removing trapped animals permanently","Estimating bait consumption","Capturing, marking and releasing animals"],"a":3},{"id":"5-8","w":5,"n":8,"q":"The logistic growth equation, when plotted, appears","o":["I shaped","J shaped","S shaped","O shaped"],"a":2},{"id":"5-9","w":5,"n":9,"q":"Employs a simple rule of selecting every kth unit starting with a number chosen at random from 1 to k as the random start","o":["Simple random sampling","Systematic sampling","Stratified sampling","Multistage sampling"],"a":1},{"id":"5-10","w":5,"n":10,"q":"Which of these is not a measure of absolute population density?","o":["total count","pelt count","capture-recapture method","removal method"],"a":1},{"id":"6-1","w":6,"n":1,"q":"A guild is a group of species that","o":["Occupy only one climax community","Have identical population size","Utilise resources in a similar way","Are confined to saline habitats"],"a":2},{"id":"6-2","w":6,"n":2,"q":"The climax near Tindni village is being controlled by disturbance by cattle. This is an example of","o":["climatic climax","edaphic climax","disclimax","catastrophic climax"],"a":2},{"id":"6-3","w":6,"n":3,"q":"Species abundance may be expressed in terms of","o":["Climate, soil and slope","Number of individuals, biomass or cover","Hydrosere, xerosere and halosere","Resistance, resilience and stability"],"a":1},{"id":"6-4","w":6,"n":4,"q":"Resistance refers to the ability of a community to","o":["Recover quickly after disturbance","Persist without change in the face of disturbance","Increase the number of pioneer species","Replace one seral stage with another"],"a":1},{"id":"6-5","w":6,"n":5,"q":"Importance value can be written as","o":["Relative density + Relative frequency × Relative dominance","Relative density × Relative frequency + Relative dominance","Relative density + Relative frequency + Relative dominance","Relative density × Relative frequency × Relative dominance"],"a":2},{"id":"6-6","w":6,"n":6,"q":"Secondary succession refers to succession that occurs","o":["On newly exposed rock or sand surfaces","In a saline body such as a marsh","After severe disturbance or removal of a pre-existing community","Only when climate controls the final community"],"a":2},{"id":"6-7","w":6,"n":7,"q":"Lithosere is an example of","o":["hydrosere","xerosere","psammosere","halosere"],"a":1},{"id":"6-8","w":6,"n":8,"q":"A transition area where two communities meet and integrate is called","o":["Habitat","Niche","Ecotone","Sere"],"a":2},{"id":"6-9","w":6,"n":9,"q":"Which of these is correct?","o":["Fundamental niche > Realised niche","Fundamental niche = Realised niche","Fundamental niche < Realised niche","a or b"],"a":3},{"id":"6-10","w":6,"n":10,"q":"Species richness refers to","o":["Number of species","Number of individuals of one species","Biomass of the dominant species","Basal area of all trees"],"a":0},{"id":"7-1","w":7,"n":1,"q":"In an estuary, species may use areas of","o":["high, intermediate, and low salinity","only high temperature and high fertility","only alpine wind and poor soil","only forest canopy and grassland patches"],"a":0},{"id":"7-2","w":7,"n":2,"q":"The movement of individuals away from their place of birth or hatching or seed production into a new habitat or area to survive and reproduce is called","o":["translocation","migration","dispersal","drifting"],"a":2},{"id":"7-3","w":7,"n":3,"q":"Transplantation experiments are used to find","o":["potential range","effective range","actual range","economic range"],"a":0},{"id":"7-4","w":7,"n":4,"q":"Pneumatophores are roots that:","o":["move downward to store excess salts","spread into sand dunes to stop wind erosion","grow upward from the ground to obtain air","become thorns to reduce transpiration"],"a":2},{"id":"7-5","w":7,"n":5,"q":"At night, cooler and denser air from upper hill areas flows down towards the valley. This wind pattern is called","o":["valley breeze","hill wind","ocean breeze","estuary current"],"a":1},{"id":"7-6","w":7,"n":6,"q":"Flamingos in the Rann of Kutch are associated with water bodies because they need","o":["high wind speeds and snow-covered slopes","food organisms in water and safe breeding conditions","dry deciduous leaves for summer feeding","tall coniferous trees for nesting"],"a":1},{"id":"7-7","w":7,"n":7,"q":"Estuaries are specialized habitats because they contain","o":["only freshwater throughout the year","only saline water throughout the year","only dry land and   <button class="card" onclick="start('all','All 110 in course order',QS.map((q,i)=>i),true)"><b>Study all 110</b><span class="mute">Course order, instant answer & memory tricks</span></button>
  <button class="card" ${w?"":"disabled"} onclick="start('weak','Weak spots',shuf(weak()),true)"><b>Weak spots (${w})</b><span class="mute">Questions you got wrong earlier in this app</span></button></div>
  ${last?`<p class="mute" style="margin-top:12px">Last attempt: ${last.s}/${last.t} (${Math.round(last.s/last.t*100)}%) in ${last.m}</p>`:""}
  <h2>Week-wise practice</h2><label class="mute"><input type="checkbox" ${shufWeek?"checked":""} onchange="shufWeek=this.checked"> Shuffle question order inside a week</label>
  <div class="grid" style="margin-top:12px">`;
  for(const [n,t] of WK){const b=S.best["w"+n];
    h+=`<button class="card" onclick="week(${n})"><b>Week ${n}: ${esc(t)}</b><span class="mute">10 questions</span><br>${b!=null?`<span class="tag ${b>=80?"":"w"}">Best ${b}%</span>`:`<span class="tag w">Not tried yet</span>`}</button>`}
  h+=`</div><h2>Revision guide</h2>
  <details open><summary>About this question bank</summary><p>Covers NPTEL Wild Life Ecology, Weeks 1 to 11, with 10 questions per week and 110 in total. Take the mock test to simulate the exam, then revise week by week and retry the questions you missed.</p>
  </details>
  <details open><summary>💡 High-Yield Memory Tricks & Shortcuts (Cheat sheet to remember all 110 answers)</summary>
  <div class="trick-grid">
    <div class="trick-card">
      <b class="head">🧠 Landmark Scientists & Books</b>
      • <b>Linnaeus</b>: Loved <i>Labels</i> → Modern taxonomy & binomial naming.<br>
      • <b>Theophrastus</b>: <i>Theo-PHRASTUS</i> = <i>PLANTS</i> ("Enquiry into plants").<br>
      • <b>Humboldt</b>: Traveled the globe → Father of <i>Biogeography</i>.<br>
      • <b>Malthus</b>: <i>Population ecology</i> (geometric human growth vs arithmetic food).<br>
      • <b>Darwin</b>: Natural selection & evolution.
    </div>
    <div class="trick-card">
      <b class="head">🔄 Twin Traps & Crucial Distinctions</b>
      • <b>Allo vs Auto grooming</b>: <i>Allo</i> = other bird's head; <i>Auto</i> = oneself.<br>
      • <b>Ecto vs Endo parasite</b>: Leech on skin = <i>Ecto</i>; inside host = <i>Endo</i>.<br>
      • <b>GPP vs NPP</b>: GPP is gross energy fixed; NPP = GPP - Respiration.<br>
      • <b>Resistance vs Resilience</b>: Resistance = staying unchanged; Resilience = recovering.<br>
      • <b>Stalactite vs Stalagmite</b>: Stala<b>C</b>tite from <b>C</b>eiling; Stala<b>G</b>mite from <b>G</b>round; both form a <b>Column</b>!
    </div>
    <div class="trick-card">
      <b class="head">📐 Formulas & Sequences to Lock In</b>
      • <b>Fragmentation Sequence (DPFA)</b>: <i>Dissection → Perforation → Fragmentation → Attrition</i>.<br>
      • <b>Fishery Equation</b>: <code>R + G = M + F</code> (Recruitment + Growth = Mortality + Fishing).<br>
      • <b>Importance Value Index (IVI)</b>: Density + Frequency + Dominance (<i>all sums, NO multiplication!</i>).<br>
      • <b>Malthus Model</b>: Population = <i>Geometric</i> (1,2,4,8); Food = <i>Arithmetic</i> (1,2,3,4).
    </div>
    <div class="trick-card">
      <b class="head">📏 Numbers & Percentages to Memorize</b>
      • <b>Plastic debris sizes</b>: Macrodebris <code>&gt; 20 mm</code> | Mesodebris <code>5–20 mm</code>.<br>
      • <b>Ocean plastic sink</b>: Exactly <code>70%</code> sinks to the ocean floor.<br>
      • <b>Species-Area Loss</b>: 90% habitat loss with z = 0.30 leaves roughly <code>50% (half)</code> of species.<br>
      • <b>Maximum Sustainable Yield (MSY)</b>: Located at the <code>mid-point</code> of the sigmoidal curve.<br>
      • <b>Replacement Fertility</b>: Must be <code>&gt; 2</code> for population to grow.
    </div>
    <div class="trick-card">
      <b class="head">🔍 Sampling Techniques Shortcuts</b>
      • <b>Pan traps</b>: Bright colored pans attract <i>pollinator insects</i>.<br>
      • <b>Cover boards</b>: Moist boards attract <i>herpetofauna</i> (reptiles & amphibians).<br>
      • <b>Selecting every kth unit</b>: <i>Systematic sampling</i>.<br>
      • <b>Every combo has equal chance</b>: <i>Simple random sampling</i>.<br>
      • <b>Pelt count</b>: An indirect index, <i>NOT</i> absolute density.
    </div>
    <div class="trick-card">
      <b class="head">🌱 Core Ecology Rules in 5 Words</b>
      • <b>Emergent Principle</b>: Whole <code>&gt;</code> sum of parts.<br>
      • <b>Disclimax</b>: Climax maintained by disturbance (e.g. cattle grazing).<br>
      • <b>Ludwig's ratchet</b>: Harvest rate keeps <i>increasing</i>.<br>
      • <b>Mine pit into bird lake</b>: <i>Replacement</i> (new ecosystem).<br>
      • <b>Pneumatophores</b>: Breathing roots growing <i>upward</i> for air.<br>
      • <b>HIPPO Acronym</b>: Habitat, Invasive, Pollution, Population, Overharvesting (<i>NO Pollination</i>).
    </div>
  </div>
  </details>
  <details><summary>Week-wise focus topics</summary><div class="scroll"><table><tr><th>Week</th><th>Topic</th><th>Revise</th></tr>${WK.map(([n,t,f])=>`<tr><td>${n}</td><td>${esc(t)}</td><td>${esc(f)}</td></tr>`).join("")}</table></div></details>
  <details><summary>Look-alike questions that cause slips</summary><ul>${TRAPS.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>`;
  $("app").innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}
function mock(){start("mock","Mock test · 100 questions",shuf(QS.map((q,i)=>i)).slice(0,100),false)}
function week(n){let ids=QS.map((q,i)=>i).filter(i=>QS[i].w===n);if(shufWeek)ids=shuf(ids);start("week"+n,"Week "+n+": "+WK[n-1][1],ids,true)}
function start(mode,title,ids,instant){clearInterval(timer);Z={mode,title,ids,instant,ans:{},i:0,t0:Date.now(),pal:false,ask:false};timer=setInterval(()=>{const e=$("tm");if(e)e.textContent=fmt(Date.now()-Z.t0)},1000);draw()}
const fmt=ms=>{const s=ms/1000|0;return (s/60|0)+":"+String(s%60).padStart(2,"0")};
function draw(){
  const q=QS[Z.ids[Z.i]],n=Z.ids.length,a=Z.ans[Z.i],done=a!=null,answered=Object.keys(Z.ans).length,L="ABCD";
  let h=`<div class="qtop"><div class="row" style="justify-content:space-between"><button class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.88rem" onclick="home()">✕ Exit</button><span class="mute"><b>${Z.i+1}</b> / ${n} · <span id="tm">${fmt(Date.now()-Z.t0)}</span></span><button class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.88rem" onclick="Z.pal=!Z.pal;draw()">${Z.pal?"Close Grid":"Grid ("+answered+"/"+n+")"}</button></div>
  <div class="bar"><i style="width:${answered/n*100}%"></i></div></div>`;
  if(Z.pal)h+=`<div class="pal-box"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mute" style="font-size:.85rem"><b>Question Grid</b> (${answered}/${n} answered)</span><button class="btn ghost" style="min-height:30px;padding:4px 10px;font-size:.8rem" onclick="Z.pal=false;draw()">Close ✕</button></div><div class="pal">${Z.ids.map((id,k)=>`<button class="pb ${Z.ans[k]!=null?"a":""} ${k==Z.i?"c":""}" onclick="Z.i=${k};Z.pal=false;draw();window.scrollTo({top:0,behavior:'smooth'})">${k+1}</button>`).join("")}</div></div>`;
  h+=`<p class="mute" style="font-size:.9rem">${esc(Z.title)}</p><p class="stem">${esc(q.q)}</p>`;
  q.o.forEach((o,j)=>{let c="opt";if(Z.instant&&done){if(j===q.a)c+=" ok";else if(j===a)c+=" bad"}else if(a===j)c+=" sel";
    h+=`<button class="${c}" onclick="pick(${j})"><i>${L[j]}</i><span>${esc(o)}</span></button>`});
  if(Z.instant&&done){h+=`<p class="${a===q.a?"good":"wrong"}"><b>${a===q.a?"Correct.":"Not quite."}</b> Answer: ${L[q.a]}. ${esc(q.o[q.a])}</p>`;if(TRICKS[q.id])h+=`<div class="tip-box"><b>💡 Memory Trick:</b> ${esc(TRICKS[q.id])}</div>`;}
  const last=Z.i===n-1;
  h+=`<div class="qnav"><button class="btn ghost" ${Z.i?"":"disabled"} onclick="haptic();go(-1)">‹ Prev</button>${last?"":`<button class="btn" onclick="haptic();go(1)">Next ›</button>`}<button class="btn ${last?"":"ghost"}" onclick="haptic();Z.ask=true;draw()">${Z.instant?"Finish":"Submit test"}</button></div>`;
  if(Z.ask)h+=`<div class="card" style="margin-top:14px"><b>${n-answered?`${n-answered} unanswered question${n-answered>1?"s":""}.`:"All questions answered."}</b> Submit now?<div class="row" style="margin-top:10px"><button class="btn" onclick="haptic();finish()">Yes, show results</button><button class="btn ghost" onclick="Z.ask=false;draw()">Keep going</button></div></div>`;
  $("app").innerHTML=h;
}
function pick(j){
  haptic();
  const q=QS[Z.ids[Z.i]];
  if(Z.instant){if(Z.ans[Z.i]!=null)return;Z.ans[Z.i]=j;const m=j===q.a?S.ok:S.miss;m[q.id]=(m[q.id]||0)+1;save()}
  else Z.ans[Z.i]=j;
  draw();
}
function go(d){Z.i=Math.max(0,Math.min(Z.ids.length-1,Z.i+d));Z.ask=false;draw();window.scrollTo({top:0,behavior:'smooth'})}
function finish(){
  haptic();
  clearInterval(timer);Z.done=true;const n=Z.ids.length,ms=Date.now()-Z.t0;let s=0;const wrong=[],by={};
  Z.ids.forEach((id,k)=>{const q=QS[id],a=Z.ans[k],ok=a===q.a;by[q.w]=by[q.w]||[0,0];by[q.w][1]++;if(ok){s++;by[q.w][0]++}else wrong.push([q,a]);
    if(!Z.instant&&a!=null){const m=ok?S.ok:S.miss;m[q.id]=(m[q.id]||0)+1}});
  const pct=Math.round(s/n*100);
  if(/^week/.test(Z.mode)){const k="w"+Z.mode.slice(4);S.best[k]=Math.max(S.best[k]||0,pct)}
  S.hist.push({s,t:n,m:Z.title,d:Date.now()});S.hist=S.hist.slice(-30);save();
  const ids=wrong.map(([q])=>QS.indexOf(q));
  let h=`<div class="top"><div><p class="mute">${esc(Z.title)} · ${fmt(ms)}</p><div class="score">${s}/${n}</div><p class="sub">${pct}% correct</p></div><button class="btn ghost" onclick="home()">Home</button></div>
  <h2>By week</h2>${Object.keys(by).map(w=>{const [a,b]=by[w];return `<div class="wk"><span>Week ${w}</span><div class="bar"><i style="width:${a/b*100}%"></i></div><span>${a}/${b}</span></div>`}).join("")}
  <div class="row" style="margin-top:16px">${ids.length?`<button class="btn" onclick="start('retry','Retry missed',shuf(${JSON.stringify(ids)}),true)">Retry ${ids.length} missed</button>`:""}<button class="btn ghost" onclick="mock()">New mock test</button></div>
  <h2>${wrong.length?"Review missed questions":"Perfect run"}</h2>`;
  wrong.forEach(([q,a])=>{h+=`<div class="rv"><p><b>${esc(q.q)}</b></p><p class="wrong">Your answer: ${a==null?"not answered":esc(q.o[a])}</p><p class="good">Correct: ${esc(q.o[q.a])}</p>`;if(TRICKS[q.id])h+=`<div class="tip-box" style="margin-top:6px"><b>💡 Memory Trick:</b> ${esc(TRICKS[q.id])}</div>`;h+=`</div>`});
  $("app").innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}
addEventListener("keydown",e=>{if(!Z||Z.done||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase(),i="abcd1234".indexOf(k);
  if(i>=0&&!$("app").querySelector(".score"))pick(i%4);else if(k==="arrowright")go(1);else if(k==="arrowleft")go(-1)});
home();
</script>
</body>
</html>
